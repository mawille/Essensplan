<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b4f">
  <title>Essensplan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Essensplan</h1>
    <div class="seg" id="person" role="group" aria-label="Mengen für">
      <button data-person="beide">Beide</button>
      <button data-person="sie">Sie</button>
      <button data-person="er">Er</button>
    </div>
  </header>

  <main id="view"></main>

  <nav id="tabs" aria-label="Bereiche">
    <button data-tab="woche">Woche</button>
    <button data-tab="rezepte">Rezepte</button>
    <button data-tab="einkauf">Einkauf</button>
    <button data-tab="reste">Reste</button>
    <button data-tab="tipps">Tipps</button>
  </nav>

  <dialog id="recipe"></dialog>

  <script src="data.js"></script>
  <script src="rezepte.js"></script>
  <script src="app.js"></script>
</body>
</html>
